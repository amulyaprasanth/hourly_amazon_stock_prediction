name: Run Train Pipeline
permissions:
  contents: write
on:
  schedule:
    - cron: "30 0 * * 0" # Run every Sunday at 00:30 am after completion of feature and inference pipelines (UTC)
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run Training Pipeline
        run: uv run python -m src.training_pipeline

      - name: Commit updated models
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/models/
          git commit -m "Update model registry [skip ci]" || echo "No changes"

          git push
