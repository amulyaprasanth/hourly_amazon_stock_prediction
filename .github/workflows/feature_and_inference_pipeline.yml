name: Run Feature and Inference Pipeline Daily
permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run Feature Pipeline
        run: uv run python -m src.feature_pipeline

      - name: Run Inference Pipeline
        run: uv run python -m src.inference_pipeline

      - name: Commit updated database
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          # copy data files into docs/ so GitHub Pages can serve them
          mkdir -p docs/data
          cp artifacts/predictions.csv docs/data/predictions.csv || true
          cp artifacts/predicted_vs_actual.csv docs/data/predicted_vs_actual.csv || true
          cp src/models/registry.json docs/data/registry.json

          git add features.db artifacts/ docs/data/

          git diff --cached --quiet || \
            git commit -m "Update feature store and predictions [skip ci]"

          git push
